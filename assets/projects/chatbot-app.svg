<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7a5cff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00e6ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#grad1)" />
  <g transform="translate(200, 150)">
    <!-- Chat bubble icon -->
    <circle cx="0" cy="-10" r="50" fill="white" opacity="0.9" />
    <circle cx="30" cy="20" r="35" fill="white" opacity="0.8" />
    <!-- Dots inside bubble -->
    <circle cx="-15" cy="-15" r="5" fill="#7a5cff" />
    <circle cx="0" cy="-15" r="5" fill="#7a5cff" />
    <circle cx="15" cy="-15" r="5" fill="#7a5cff" />
  </g>
  <text x="200" y="270" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle">AI Chatbot</text>
</svg>
