<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fa709a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fee140;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#grad5)" />
  <g transform="translate(200, 150)">
    <!-- Dumbbell -->
    <rect x="-70" y="-8" width="25" height="16" rx="4" fill="white" opacity="0.9" />
    <rect x="-45" y="-4" width="90" height="8" rx="4" fill="white" opacity="0.9" />
    <rect x="45" y="-8" width="25" height="16" rx="4" fill="white" opacity="0.9" />
    <!-- Heart rate line -->
    <path d="M -60 40 L -40 40 L -30 25 L -20 55 L -10 30 L 0 40 L 20 40" stroke="white" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />
  </g>
  <text x="200" y="270" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle">Fitness Planner</text>
</svg>
