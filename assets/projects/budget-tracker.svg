<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#grad4)" />
  <g transform="translate(200, 150)">
    <!-- Piggy bank -->
    <ellipse cx="0" cy="0" rx="55" ry="45" fill="white" opacity="0.9" />
    <circle cx="-25" cy="-10" r="6" fill="#4facfe" />
    <!-- Coin slot -->
    <rect x="-15" y="-35" width="30" height="4" rx="2" fill="#4facfe" />
    <!-- Legs -->
    <rect x="-40" y="30" width="12" height="20" rx="6" fill="white" opacity="0.9" />
    <rect x="-15" y="30" width="12" height="20" rx="6" fill="white" opacity="0.9" />
    <rect x="3" y="30" width="12" height="20" rx="6" fill="white" opacity="0.9" />
    <rect x="28" y="30" width="12" height="20" rx="6" fill="white" opacity="0.9" />
    <!-- Tail -->
    <path d="M 55 -5 Q 70 -15, 65 -25" stroke="white" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.9" />
  </g>
  <text x="200" y="270" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle">Budget Tracker</text>
</svg>
