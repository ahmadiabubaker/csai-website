<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CSAI — Join</title>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
<header class="header">
  <div class="nav container">
    <a class="brand" href="index.html" aria-label="CSAI home">CSAI</a>
    <nav class="nav-links" aria-label="Main navigation">
      <a href="index.html">Home</a>
      <a href="projects.html">Projects</a>
      <a href="events.html">Events</a>
      <a href="blog.html">Blog</a>
      <a href="join.html" class="active">Join</a>
    </nav>
  </div>
</header>

<section class="section">
  <div class="container">
    <h2>Join CSAI</h2>
    <p class="lead">Become a member to get event reminders, project mentorship, and more.</p>

    <div id="join-success" class="success">Submitted! We’ll be in touch soon.</div>
    <div id="join-error" class="error"></div>

    <form id="join-form" class="form">
      <label class="label">Full Name</label>
      <input class="input" name="name" required />
      <label class="label">Email</label>
      <input class="input" type="email" name="email" required />
      <label class="label">Major / Year</label>
      <input class="input" name="major" placeholder="e.g., CS / Sophomore" />
      <label class="label">Why do you want to join?</label>
      <textarea class="input" name="motivation" rows="4"></textarea>
      <button class="btn primary" type="submit">Submit</button>
      <p style="color:#556; font-size:13px; margin-top:8px">Note: we’ll wire this to your Google Sheets endpoint once you share it.</p>
    </form>
  </div>
</section>

<footer class="footer">
  © 2025 CSAI — Computer Science + AI Club
</footer>

<script src="assets/js/main.js"></script>
<script src="assets/js/join.js"></script>
</body>
</html>
